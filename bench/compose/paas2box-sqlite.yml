# paas2box over SQLite (small-customer profile). Built from the repo Dockerfile.
services:
  paas2box:
    build:
      context: ../..
    image: paas2box:bench
    environment:
      PB_DIALECT: sqlite
      PB_SQLITE_FILE: /data/paas2box.db
      PB_MIGRATE: '1'
      PORT: '8000'
    volumes:
      - paas2box-data:/data
    ports:
      - '8000:8000'
volumes:
  paas2box-data:
