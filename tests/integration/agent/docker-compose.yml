name: pbx-agent-e2e
services:
  dind:
    image: docker:29-dind
    privileged: true
    environment: { DOCKER_TLS_CERTDIR: "" }
    volumes: [ docker-run:/var/run ]
    healthcheck:
      test: ["CMD","docker","version"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
  paasbox:
    image: paas2box
    environment:
      PB_MIGRATE: "1"
      PB_SQLITE_FILE: /data/paas2box.db
    ports: ["8000:8000"]
    volumes: [ pb-data:/data ]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:8000/api/schema/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 3s
  agent:
    image: saashup/netbox-docker-agent
    user: root
    depends_on:
      dind: { condition: service_healthy }
      paasbox: { condition: service_healthy }
    ports: ["1880:1880"]
    volumes:
      - docker-run:/var/run
      - ./config.js:/data/config.js
volumes: { docker-run: {}, pb-data: {} }
